# Migrated from the currently effective Rexy2 configuration.
# This file is loaded last in CUSTOM mode.

move_base_flex:
  FTCPlanner:
    kd_ang: 0.5
    kd_lat: 2.2
    kd_lon: 0.5
    ki_ang: 0.0
    ki_ang_max: 62.0
    ki_lat: 0.03
    ki_lat_max: 20.0
    ki_lon: 0.0
    ki_lon_max: 10.0
    kp_ang: 1.4
    kp_lat: 4.7
    kp_lon: 1.5
    max_cmd_vel_ang: 3.2
    max_cmd_vel_speed: 0.4
    max_follow_distance: 0.8
    speed_angular: 40.0
    speed_fast: 0.3
    speed_fast_threshold: 0.3
    speed_fast_threshold_angle: 5.0

  DockingFTCPlanner:
    kd_ang: 0.5
    kd_lat: 2.2
    kd_lon: 0.5
    ki_ang: 0.0
    ki_ang_max: 62.0
    ki_lat: 0.0
    ki_lat_max: 20.0
    ki_lon: 0.0
    ki_lon_max: 10.0
    kp_ang: 1.4
    kp_lat: 4.7
    kp_lon: 1.5
    acceleration: 0.05
    max_cmd_vel_ang: 0.5
    max_cmd_vel_speed: 0.2
    max_goal_angle_error: 10.0
    speed_angular: 15.0
    speed_fast_threshold: 0.3

ll:
  services:
    sound:
      language: "en"
      volume: 0
      background_sounds: false
      dfp_is_5v: false

    gps:
      baudrate: 115200
      serial_port: /dev/gps
      device_type: serial
      mode: absolute
      protocol: NMEA
      datum_lat: 48.05955269904
      datum_long: 11.66314128680
      datum_height: 0

    imu:
      axis_config: "+X-Y-Z"

    diff_drive:
      ticks_per_m: 300.0
      wheel_distance_m: 0.325

    power:
      battery_full_voltage: 27.9
      battery_empty_voltage: 23.0
      battery_critical_voltage: 22.0
      battery_critical_high_voltage: 28.4
      charge_critical_high_voltage: 29.0
      charge_critical_high_current: 1.0

xbot_positioning:
  antenna_offset_x: -0.075
  antenna_offset_y: 0.0
  max_gps_accuracy: 0.2
  debug: false

mower_speed_limiter:
  mow_erpm_limit: 3000

map_service:
  persist_mode: 3
  persist_num_paths: 10

ntrip_client:
  host: 192.168.178.132
  port: 2101
  username: Rexy2
  password: none
  mountpoint: ob-one
  reconnect_attempt_max: 99999
  reconnect_attempt_wait_seconds: 5

mower_logic:
  automatic_mode: 1
  docking_approach_distance: 2.0
  docking_distance: 1.0
  docking_extra_time: 0.0
  docking_retry_count: 4
  docking_redock: true
  docking_waiting_time: 0.0
  outline_overlap_count: 0
  outline_count: 4
  outline_offset: 0.05
  mow_angle_offset: 0.0
  mow_angle_offset_is_absolute: false
  mow_angle_increment: 48.0
  gps_wait_time: 20.0
  gps_timeout: 5.0
  rain_mode: 2
  rain_delay_minutes: 30
  rain_check_seconds: 20
  cu_rain_threshold: -1
  undock_angled_distance: 0.0
  undock_angle: 0.0
  undock_distance: 2.0
  undock_fixed_angle: false
  undock_use_curve: false
  emergency_lift_period: -1
  emergency_tilt_period: -1
  ignore_charging_current: false
  perimeter_signal: 0
  tool_width: 0.13
  motor_cold_temperature: 40.0
  motor_hot_temperature: 80.0
  shutdown_esc_max_pitch: 0
  enable_mower: true
  emergency_input_config: ""

xbot_monitoring:
  external_mqtt_enable: false
